apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gateway-monitor
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: booking-monitor
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: booking-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
