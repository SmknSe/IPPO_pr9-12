services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

  gateway:
    build: ./services/gateway
    ports:
      - "8000:8000"
    environment:
      BOOKING_SERVICE_URL: http://booking-service:8001
    depends_on:
      - booking-service

  booking-service:
    build: ./services/booking_service
    environment:
      DATABASE_URL: postgresql+psycopg2://booking:booking@postgres:5432/booking
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pg_data:
